    <h1 >Lobo-Guará</h1>
    <img style="width: 60%;" src="https://static.nationalgeographicbrasil.com/files/styles/image_3200/public/02gambarini_779-24.webp?w=767&h=432" alt="aqui tem a imagem de um Lobo-Guará">
    <p style="padding: 30px;">O Lobo-Guará, também chamado guará, aguará, aguaraçu, lobo-de-crina, lobo-de-juba e lobo-vermelho, é uma espécie de canídeo endêmico da América do Sul. Suas marcas lembram as de uma raposa-vermelha, mas não é uma raposa nem um lobo.
